[package]
name = "mathcraft-showcase"
version = "0.1.0"
edition = "2021"
description = "Interactive visualization showcase for mathcraft"

[lib]
name = "mathcraft_showcase_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
